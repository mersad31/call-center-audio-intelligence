      context: ./services/silence-analysis-service
      dockerfile: Dockerfile
    container_name: silence-analysis-service
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
    expose:
      - "8004"
    volumes:
      - silence_analysis_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8004/docs || exit 1"]
      interval: 30s
