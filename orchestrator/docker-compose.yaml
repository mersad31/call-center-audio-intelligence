version: "3.9"

name: call-center-ai-orchestrator

services:
  orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    container_name: orchestrator
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

      # Internal service URLs
      DIARIZATION_URL: http://diarization-service:8001
      STT_URL: http://stt-service:8002
      ROLE_DETECTION_URL: http://role-detection-service:8003
      SILENCE_FROM_SEGMENTS_URL: http://silence-analysis-service:8004
      OVERLAP_URL: http://overlap-detection-service:8005
      BEHAVIOR_URL: http://behavior-detection-service:8006
      SENTIMENT_URL: http://sentiment-analysis-service:8007
      OPERATOR_SCORE_URL: http://operator-scoring-service:8008

      # Security
      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY:-change-me}

      # Optional runtime paths
      LOG_DIR: /app/logs
      DATA_DIR: /app/data
    ports:
      - "8000:8000"
    volumes:
      - orchestrator_logs:/app/logs
      - orchestrator_data:/app/data
      - ./orchestrator:/app
    depends_on:
      - diarization-service
      - stt-service
      - role-detection-service
      - silence-analysis-service
      - overlap-detection-service
      - behavior-detection-service
      - sentiment-analysis-service
      - operator-scoring-service
    command: >
      sh -c "uvicorn main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8000/docs || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - ai-network

  diarization-service:
    build:
      context: ./services/diarization-service
      dockerfile: Dockerfile
    container_name: diarization-service
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
    expose:
      - "8001"
    volumes:
      - diarization_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8001/docs || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - ai-network

  stt-service:
    build:
      context: ./services/stt-service
      dockerfile: Dockerfile
    container_name: stt-service
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
    expose:
      - "8002"
    volumes:
      - stt_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8002/docs || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - ai-network

  role-detection-service:
    build:
      context: ./services/role-detection-service
      dockerfile: Dockerfile
    container_name: role-detection-service
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
    expose:
      - "8003"
    volumes:
      - role_detection_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8003/docs || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - ai-network

  silence-analysis-service:
